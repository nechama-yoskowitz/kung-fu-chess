# Kung-Fu Chess — Stage 1 Docker Compose
#
# Services:
#   postgres   — persistent user/rating storage
#   redis      — shared ephemeral state (Stage 2+) and health check target
#   server     — Kung-Fu Chess WebSocket game server
#
# Run with:
#   docker compose up --build
#
# Environment variables can be overridden in a .env file at the project root.
# Example .env:
#   POSTGRES_PASSWORD=changeme
#   KFC_WS_PORT=8765

# ── Named volumes (data persists across container restarts) ──────────────────
volumes:
  postgres_data:
    driver: local

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kfc_secret}
      POSTGRES_DB: kungfu_chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose to host for local inspection (psql, pgAdmin, etc.)
      # Remove this port mapping in production.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfc -d kungfu_chess"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    # Disable persistence for ephemeral state — we don't need Redis to
    # persist across restarts in Stage 1.
    ports:
      # Expose to host for local inspection (redis-cli, RedisInsight, etc.)
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Kung-Fu Chess server ─────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${KFC_WS_PORT:-8765}:8765"
    environment:
      # Database
      KFC_DB_BACKEND: postgres
      KFC_POSTGRES_DSN: postgresql://kfc:${POSTGRES_PASSWORD:-kfc_secret}@postgres:5432/kungfu_chess

      # Redis
      KFC_REDIS_ENABLED: "1"
      KFC_REDIS_URL: redis://redis:6379/0

      # WebSocket
      KFC_WS_HOST: "0.0.0.0"
      KFC_WS_PORT: "8765"

      # Logging
      KFC_LOG_LEVEL: ${KFC_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL",
             "bash -c 'echo > /dev/tcp/localhost/8765' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
