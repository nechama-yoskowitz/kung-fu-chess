# Kung-Fu Chess — Stage 4 Docker Compose
#
# Services:
#   postgres   — persistent user/rating storage
#   redis      — shared ephemeral state + internal Pub/Sub message bus
#   server-1   — Game Server 1  (WebSocket port 8765 on host)
#   server-2   — Game Server 2  (WebSocket port 8766 on host)
#
# Both game servers share PostgreSQL and Redis.
# They register themselves in Redis on startup and send heartbeats so
# GameAllocator can pick the least-loaded one for each new room.
# Cross-server commands travel via Redis Pub/Sub (Stage 4).
#
# Run with:
#   docker compose up --build
#
# Environment variables can be overridden in a .env file.

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Common server configuration (YAML anchor) ─────────────────────────────────
x-server-base: &server-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    KFC_DB_BACKEND: postgres
    KFC_POSTGRES_DSN: postgresql://kfc:${POSTGRES_PASSWORD:-kfc_secret}@postgres:5432/kungfu_chess
    KFC_REDIS_ENABLED: "1"
    KFC_REDIS_URL: redis://redis:6379/0
    KFC_WS_HOST: "0.0.0.0"
    KFC_WS_PORT: "8765"
    KFC_LOG_LEVEL: ${KFC_LOG_LEVEL:-INFO}
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8765' 2>/dev/null"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 30s

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kfc_secret}
      POSTGRES_DB: kungfu_chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfc -d kungfu_chess"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Game Server 1 ─────────────────────────────────────────────────────────
  server-1:
    <<: *server-base
    environment:
      KFC_DB_BACKEND: postgres
      KFC_POSTGRES_DSN: postgresql://kfc:${POSTGRES_PASSWORD:-kfc_secret}@postgres:5432/kungfu_chess
      KFC_REDIS_ENABLED: "1"
      KFC_REDIS_URL: redis://redis:6379/0
      KFC_WS_HOST: "0.0.0.0"
      KFC_WS_PORT: "8765"
      KFC_LOG_LEVEL: ${KFC_LOG_LEVEL:-INFO}
      KFC_SERVER_ID: "server-1"
    ports:
      - "8765:8765"

  # ── Game Server 2 ─────────────────────────────────────────────────────────
  server-2:
    <<: *server-base
    environment:
      KFC_DB_BACKEND: postgres
      KFC_POSTGRES_DSN: postgresql://kfc:${POSTGRES_PASSWORD:-kfc_secret}@postgres:5432/kungfu_chess
      KFC_REDIS_ENABLED: "1"
      KFC_REDIS_URL: redis://redis:6379/0
      KFC_WS_HOST: "0.0.0.0"
      KFC_WS_PORT: "8765"
      KFC_LOG_LEVEL: ${KFC_LOG_LEVEL:-INFO}
      KFC_SERVER_ID: "server-2"
    ports:
      - "8766:8765"   # host:8766 → container:8765

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KFC_DB_BACKEND: postgres
      KFC_POSTGRES_DSN: postgresql://kfc:${POSTGRES_PASSWORD:-kfc_secret}@postgres:5432/kungfu_chess
      KFC_HTTP_HOST: "0.0.0.0"
      KFC_HTTP_PORT: "8080"
      KFC_LOG_LEVEL: ${KFC_LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8080/health', timeout=4); sys.exit(0 if r.status == 200 else 1)\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
