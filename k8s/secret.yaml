# PostgreSQL credentials.
#
# IMPORTANT: do NOT commit real passwords.
# Before deploying, replace the values below with base64-encoded secrets:
#
#   echo -n 'your-password' | base64
#
# Or generate via:
#   kubectl create secret generic kfc-postgres-secret \
#     --from-literal=postgres-password=<PASSWORD> \
#     --from-literal=postgres-dsn=postgresql://kfc:<PASSWORD>@postgres:5432/kungfu_chess \
#     --namespace=kungfu-chess --dry-run=client -o yaml
#
# The placeholder values below encode: kfc_secret
