# Redis — shared ephemeral fast store.
#
# Holds: matchmaking queues, room→server routing, player→room mapping,
# reconnect slots, server heartbeats.
#
# Uses a Deployment (not StatefulSet) because Redis data here is
# intentionally ephemeral — all game state is rebuilt on startup.
# A PVC is still attached so that a brief pod restart doesn't wipe
# a large queue mid-session.  For production, use Redis Cluster or
# a managed service (ElastiCache, Memorystore, etc.).
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kungfu-chess
  labels:
    app: redis
    app.kubernetes.io/part-of: kungfu-chess
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kungfu-chess
  labels:
    app: redis
    app.kubernetes.io/part-of: kungfu-chess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: kungfu-chess
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: redis
          image: redis:7-alpine-amd64
          imagePullPolicy: IfNotPresent
          # Disable AOF for pure ephemeral mode; enable RDB snapshot for durability
          command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --appendonly
            - "no"
            - --dir
            - /data
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: kungfu-chess
  labels:
    app: redis
    app.kubernetes.io/part-of: kungfu-chess
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
